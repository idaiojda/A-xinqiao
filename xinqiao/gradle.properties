# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ── JVM 内存：增大堆内存，避免 GC 频繁触发 ──────────────────────────────
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djava.net.ssl.trustStoreType=PKCS12 -Djava.net.ssl.trustStore=cacerts

# 设置正确的Java Home
org.gradle.java.home=C:\\Users\\z\\.jdks\\ms-17.0.16

# ── Gradle Daemon：保持 JVM 热启动，避免每次重新初始化 ──────────────────
org.gradle.daemon=true

# ── 并行编译：多模块同时构建 ─────────────────────────────────────────────
org.gradle.parallel=true

# ── 按需配置：只配置当前任务涉及的模块 ──────────────────────────────────
org.gradle.configureondemand=true

# ── 构建缓存：复用未变更模块的编译产物 ──────────────────────────────────
org.gradle.caching=true

# ── 文件系统监听：加速增量构建的变更检测 ────────────────────────────────
org.gradle.vfs.watch=true

# ── Worker 数量：根据 CPU 核心数调整（建议 4~8）────────────────────────
org.gradle.workers.max=4

# ── AndroidX ─────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# ── Kotlin 编译器：使用 daemon 模式，避免每次重新加载编译器 ─────────────
kotlin.code.style=official
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx2048m

# ── Kotlin 增量编译：只重新编译变更的文件 ───────────────────────────────
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.incremental.js=true
kotlin.incremental.useClasspathSnapshot=true

# ── Kotlin 编译缓存 ───────────────────────────────────────────────────────
kotlin.caching.enabled=true

# ── Kotlin 并行任务（跨模块并行编译）────────────────────────────────────
kotlin.parallel.tasks.in.project=true

# ── KSP 增量处理（替代 kapt，速度更快）──────────────────────────────────
ksp.incremental=true
ksp.use.worker.api=true
ksp.incremental.log=false

# ── kapt 增量编译（如项目仍使用 kapt）───────────────────────────────────
kapt.use.worker.api=true
kapt.incremental.apt=true
kapt.include.compile.classpath=false

# ── JVM 字节码版本 ────────────────────────────────────────────────────────
android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
android.compileOptions.targetCompatibility = JavaVersion.VERSION_17

# ── Configuration Cache（Gradle 8+ 支持，可加速配置阶段）────────────────
# 注意：部分插件不兼容，如遇报错可改为 false
org.gradle.configuration-cache=false
