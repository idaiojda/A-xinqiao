server.port=8081
server.address=0.0.0.0
server.servlet.context-path=/

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO

# JPA/Hibernate 配置 - 不自动修改表结构
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# 数据库配置
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/xinqiao?useSSL=false&serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis 配置
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# JWT 配置
app.jwt.secret=${JWT_SECRET:local-dev-secret-32-bytes-minimum-123456}
app.jwt.expiration-seconds=${JWT_EXP:36000}

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=2KB
