server.port=8081
server.servlet.context-path=/

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/xinqiao?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
app.jwt.secret=${JWT_SECRET:local-dev-secret-32-bytes-minimum-123456}
app.jwt.expiration-seconds=${JWT_EXP:36000}
